[package]
name = "chromora"
version = "0.10.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Chromora native photo editor"

[lib]
name = "chromora"
path = "src/lib.rs"

[[bin]]
name = "chromora"
path = "src/main.rs"

[[bin]]
name = "photo_control"
path = "src/bin/photo_control.rs"

[dependencies]
gpui = "=0.2.2"
# GPUI 0.2.2 -> gpui_http_client -> zed-async-tar -> xattr 0.2.3
# uses libc::ENOATTR on Linux; 0.2.183 is the newest version verified to retain it.
libc = "=0.2.183"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "tiff"] }
tiff = "=0.10.3"
jpeg-encoder = "=0.6.1"
exif = { package = "kamadak-exif", version = "=0.6.1" }
moxcms = "=0.9.1"
same-file = "=1.0.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tempfile = "=3.27.0"
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]

[build-dependencies]
cc = "=1.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
